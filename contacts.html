<section class="content py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card soft-shadow border-0 p-4">
                    <h3 class="fw-bold mb-4 text-center">Оповестим вас в кратчайшие сроки</h3>
                    <form id="feedbackForm" novalidate>

                        <div class="mb-3">
                            <label for="fullname" class="form-label">
                                ФИО <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="fullname"
                                   placeholder="Иванов Иван Иванович">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">
                                Телефон <span class="text-danger">*</span>
                            </label>
                            <input type="tel" class="form-control" id="phone"
                                   placeholder="+7 (___) ___-__-__">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" id="email"
                                   placeholder="example@mail.ru">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Сообщение</label>
                            <textarea class="form-control" id="message"
                                      rows="3" maxlength="300"
                                      placeholder="Введите сообщение..."></textarea>
                            <div class="form-text">До 300 символов</div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox"
                                   id="agreement">
                            <label class="form-check-label" for="agreement">
                                Я согласен на обработку персональных данных
                                <span class="text-danger">*</span>
                            </label>
                            <div class="invalid-feedback"></div>
                        </div>

                        <label for="fullname" class="form-text">
                                <span class="text-danger">*</span> - Обязательно к заполнению
                            </label>

                        <div class="text-center">
                            <button type="submit" class="btn btn-dark me-2">
                                Отправить
                            </button>
                            <button type="reset" class="btn btn-outline-secondary">
                                Очистить
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</section>
